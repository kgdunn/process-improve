# Design Types Knowledge Base
# Each entry describes a DOE design type with properties, guidance, and metadata.

- id: full_factorial
  display_name: "Full Factorial (2^k)"
  category: factorial
  description:
    novice: >
      Tests every combination of factor levels. Simple and complete, but the
      number of runs doubles with each added factor.
    intermediate: >
      A 2^k full factorial runs all 2^k combinations of k factors at two levels.
      It estimates every main effect and every interaction cleanly (resolution
      is infinite). Cost grows exponentially with k, so it is practical only for
      k <= 5 or so.
    expert: >
      The 2^k full factorial is the benchmark against which all other two-level
      designs are judged. Resolution is technically infinite - no alias chains
      exist. The design is both D-optimal and I-optimal within the class of
      orthogonal two-level designs. Center points can be added to test for
      curvature without inflating the factorial portion.
  suitable_for:
    - "Five factors or fewer, with the budget to run every combination"
    - "Need all interactions estimated cleanly"
    - "Confirmation or follow-up after screening"
  properties:
    resolution: "Full (infinite)"
    orthogonal: true
    rotatable: false
    supports_quadratic: false
    supports_interaction: true
  min_runs:
    formula: "2^k"
    examples: {"2": 4, "3": 8, "4": 16, "5": 32}
  supports_models:
    - main_effects
    - two_factor_interactions
    - three_factor_interactions
    - full_interaction
  can_augment_to:
    - {target: ccd, method: "Add center + axial points"}
    - {target: fractional_factorial, method: "Use a fraction for more factors"}
  advantages:
    - "Estimates all effects and interactions without aliasing"
    - "Simple to plan and analyze"
    - "Provides a baseline for comparison with other designs"
  disadvantages:
    - "The number of runs doubles with each added factor"
    - "Cannot detect curvature without center points"
    - "Inefficient when many factors are likely inert"
  common_misconceptions:
    - "A full factorial is always the best design - it is only best when you can afford it and need all interactions"
  references:
    - "Montgomery (2019), Ch. 5–6"
    - "Box, Hunter & Hunter (2005), Ch. 5"

- id: fractional_factorial
  display_name: "Fractional Factorial (2^(k-p))"
  category: factorial
  description:
    novice: >
      Runs only a fraction of the full factorial combinations. Saves runs but
      some effects become tangled together (aliased).
    intermediate: >
      A 2^(k-p) fractional factorial uses 2^(k-p) runs to study k factors.
      The generators determine which effects are aliased. Resolution indicates
      the severity of aliasing: resolution III aliases main effects with two-
      factor interactions; resolution IV aliases two-factor interactions with
      each other; resolution V or higher keeps main effects and two-factor
      interactions clean.
    expert: >
      Fractional factorial designs are constructed by choosing p generators that
      define 2^p - 1 words in the defining relation. Resolution equals the
      length of the shortest word. Minimum-aberration fractions minimize the
      number of short words, improving estimability. Foldover adds the mirror
      image of the fraction, breaking specific alias chains: a full foldover of
      a resolution III fraction gives resolution IV, clearing every main effect
      of two-factor interactions. Folding over a resolution IV fraction does not
      raise its resolution, since its defining words all have even length.
  suitable_for:
    - "Four or more factors on a limited budget"
    - "Screening or characterization studies"
    - "When higher-order interactions are assumed negligible"
  properties:
    resolution: "III, IV, or V depending on generators"
    orthogonal: true
    rotatable: false
    supports_quadratic: false
    supports_interaction: "Depends on resolution"
  min_runs:
    formula: "2^(k-p)"
    examples: {"3_res_III": 4, "4_res_IV": 8, "5_res_V": 16, "7_res_IV": 16}
  supports_models:
    - main_effects
    - "two_factor_interactions (resolution >= V)"
  can_augment_to:
    - {target: full_factorial, method: "Run the complementary fraction"}
    - {target: ccd, method: "Add center + axial points to resolution V fraction"}
    - {target: fractional_factorial, method: "Foldover a resolution III fraction to reach resolution IV"}
  advantages:
    - "Dramatically reduces run count compared to full factorial"
    - "Orthogonal - clean estimation of non-aliased effects"
    - "Can augment (foldover, add runs) sequentially"
  disadvantages:
    - "Aliased effects cannot be separated without additional runs"
    - "Requires understanding of confounding structure"
    - "Low-resolution fractions may miss important interactions"
  common_misconceptions:
    - "Resolution IV means all two-factor interactions are estimable - they are aliased with each other"
    - "You must always use the minimum-aberration generator - other generators may be better for specific alias priorities"
  references:
    - "Montgomery (2019), Ch. 8"
    - "Box, Hunter & Hunter (2005), Ch. 6"

- id: plackett_burman
  display_name: "Plackett-Burman"
  category: screening
  description:
    novice: >
      A screening design for finding the few important factors among many. Very
      efficient: screens up to N-1 factors in N runs (N a multiple of 4).
    intermediate: >
      Plackett-Burman (PB) designs are resolution III screening designs where
      N is a multiple of 4. They estimate main effects only; two-factor
      interactions are partially aliased with main effects in a complex pattern.
      PB designs are not regular fractions, so the alias structure is more
      diffuse than 2^(k-p) designs.
    expert: >
      PB designs are constructed from Hadamard matrices and exist for N = 4, 8,
      12, 16, 20, 24, … (multiples of 4). For N that are powers of 2 they
      coincide with resolution III 2^(k-p) fractions. The key N = 12, 20, 24
      designs are the non-geometric PBs with complex, partial aliasing. Each
      main effect is partially confounded with every two-factor interaction not
      involving that factor; the alias coefficient is the inner product of the
      two columns divided by N, ±1/3 in the 12-run design and ±0.2 or ±0.6 in
      the 20-run design. Foldover can de-alias specific effects.
  suitable_for:
    - "Screening 6–47 factors"
    - "A tight budget: little more than one run for each factor"
    - "Initial exploratory experiments"
  properties:
    resolution: "III"
    orthogonal: true
    rotatable: false
    supports_quadratic: false
    supports_interaction: false
  min_runs:
    formula: "next_multiple_of_4(k + 1)"
    examples: {"7": 8, "11": 12, "15": 16, "19": 20}
  supports_models:
    - main_effects
  can_augment_to:
    - {target: fractional_factorial, method: "Use active factors in a resolution V fraction"}
    - {target: dsd, method: "Screen the active factors again in a definitive screening design"}
    - {target: ccd, method: "Follow up the active factors with a response surface design"}
  advantages:
    - "Very run-efficient for screening"
    - "Orthogonal for main effects"
    - "Scales to large numbers of factors"
  disadvantages:
    - "Cannot estimate interactions"
    - "Complex partial aliasing makes interpretation harder than regular fractions"
    - "No information on curvature"
  common_misconceptions:
    - "PB designs estimate two-factor interactions - they do not; interactions are partially aliased with every main effect"
  references:
    - "Plackett & Burman (1946)"
    - "Montgomery (2019), Ch. 8.6"

- id: box_behnken
  display_name: "Box-Behnken Design (BBD)"
  category: response_surface
  description:
    novice: >
      An efficient design for fitting curved (quadratic) models. Uses three
      levels per factor but never runs extreme corner combinations.
    intermediate: >
      Box-Behnken designs (BBD) are three-level response surface designs that
      estimate all main effects, interactions, and quadratic terms. They avoid
      the extreme vertices of the cube - all design points are at the midpoints
      of edges or at center. This makes them useful when factor extremes are
      operationally difficult.
    expert: >
      BBD designs are formed by combining 2^2 factorials in pairs of factors
      with the remaining factors at center. They are nearly rotatable and
      require fewer runs than CCD for 3–7 factors. They do not include axial
      points, so prediction variance is slightly higher at the corners. BBDs
      exist for k = 3, 4, 5, 6, 7 and selected higher k.
  suitable_for:
    - "3–7 factors, response surface modeling"
    - "When extreme factor combinations should be avoided"
    - "When the budget is tighter than a central composite design allows"
  properties:
    resolution: "Full for quadratic model"
    orthogonal: false
    rotatable: "Nearly"
    supports_quadratic: true
    supports_interaction: true
  min_runs:
    formula: "Depends on k"
    examples: {"3": 15, "4": 27, "5": 46, "6": 54, "7": 62}
  supports_models:
    - main_effects
    - two_factor_interactions
    - quadratic
  can_augment_to:
    - {target: ccd, method: "Add axial points for rotatability"}
  advantages:
    - "Fewer runs than CCD for same number of factors"
    - "Avoids extreme corner points"
    - "Nearly rotatable"
    - "Three levels per factor (simpler to run)"
  disadvantages:
    - "Not available for two factors"
    - "Not fully rotatable"
    - "Prediction variance higher at corners"
    - "Cannot be built sequentially from a factorial base"
  common_misconceptions:
    - "BBD is always better than CCD because it uses fewer runs - CCD may be preferred when corner points are feasible and rotatability matters"
  references:
    - "Box & Behnken (1960)"
    - "Myers, Montgomery & Anderson-Cook (2016), Ch. 7"

- id: ccd
  display_name: "Central Composite Design (CCD)"
  category: response_surface
  description:
    novice: >
      The most popular design for fitting curved models. Combines a factorial
      base with star (axial) points and center points.
    intermediate: >
      A CCD consists of a 2^k (or 2^(k-p)) factorial, 2k axial (star) points
      at distance alpha from center, and center points. The alpha value controls
      rotatability (alpha = n_F^(1/4), the fourth root of the number of cube
      runs, so (2^k)^(1/4) with a full factorial cube) or face-centering
      (alpha = 1 for face-centered CCD, which keeps all points at three levels).
    expert: >
      CCD is the workhorse of RSM. The factorial portion can be a full or
      fractional factorial (resolution V or higher recommended). Rotatability
      requires alpha = (2^k)^(1/4) for full factorial base. Orthogonal blocking
      is achievable by choosing center point counts that satisfy the orthogonal
      blocking condition. Face-centered CCD (alpha = 1) sacrifices rotatability
      for three-level simplicity and is common in constrained experimental
      regions.
  suitable_for:
    - "2–6 factors, response surface modeling"
    - "Sequential experimentation (factorial first, then augment)"
    - "When rotatability or orthogonal blocking is desired"
  properties:
    resolution: "Full for quadratic model"
    orthogonal: "With proper blocking"
    rotatable: "When alpha = (2^k)^(1/4)"
    supports_quadratic: true
    supports_interaction: true
  min_runs:
    formula: "2^k + 2k + center_points"
    examples: {"2": 13, "3": 20, "4": 30, "5": 52}
  supports_models:
    - main_effects
    - two_factor_interactions
    - quadratic
  can_augment_to: []
  advantages:
    - "Can be built sequentially from an existing factorial"
    - "Rotatable when alpha chosen correctly"
    - "Well-understood statistical properties"
    - "Supports orthogonal blocking"
  disadvantages:
    - "More runs than a Box-Behnken design for the same number of factors"
    - "Axial points may extend beyond the feasible region"
    - "Five levels for each factor, unless the axial points are on the faces of the cube"
  common_misconceptions:
    - "CCD always requires 5 factor levels - face-centered CCD (alpha=1) uses only 3"
    - "You must start with a full factorial - a resolution V fraction works as the cube portion"
  references:
    - "Box & Wilson (1951)"
    - "Myers, Montgomery & Anderson-Cook (2016), Ch. 7"

- id: dsd
  display_name: "Definitive Screening Design (DSD)"
  category: screening
  description:
    novice: >
      A modern screening design that can also detect curvature and some
      interactions. Needs only 2k+1 runs for an even number k of factors
      (2k+3 for an odd number).
    intermediate: >
      Jones & Nachtsheim (2011) DSDs use 2k+1 runs for an even number k of
      continuous factors and 2k+3 for an odd number
      (three levels each). They are resolution III+ because main effects are not
      aliased with two-factor interactions or quadratic effects. If at most 3
      factors are active, DSDs can estimate the full quadratic model for those
      factors.
    expert: >
      DSDs are constructed by conference matrices. For an even number k of
      continuous factors the design has 2k+1 runs (2k+3 for odd k; 49 runs for
      21 or 22 factors, since no conference matrix of order 22 exists), with the
      property that main effects are orthogonal
      to all two-factor interactions and quadratic effects. Interactions are
      partially aliased with each other. Fake-factor variants (adding dummy
      columns) can improve estimation. Categorical factors can be incorporated
      via the CDSD extension (Jones & Nachtsheim, 2013).
  suitable_for:
    - "6–30 continuous factors"
    - "When curvature detection is needed during screening"
    - "When the budget allows about two runs for each factor, but not a response surface design"
  properties:
    resolution: "III+"
    orthogonal: "Main effects orthogonal to 2FI and quadratic"
    rotatable: false
    supports_quadratic: "Partial (if <= 3 active factors)"
    supports_interaction: "Partial (if <= 3 active factors)"
  min_runs:
    formula: "2k + 1 (even k), 2k + 3 (odd k)"
    examples: {"6": 13, "7": 17, "8": 17, "10": 21, "12": 25}
  supports_models:
    - main_effects
    - "quadratic (limited active factors)"
  can_augment_to:
    - {target: ccd, method: "Follow up the active factors with a response surface design"}
    - {target: box_behnken, method: "Follow up the active factors with a Box-Behnken design"}
  advantages:
    - "Screens and detects curvature in one design"
    - "Main effects orthogonal to 2FI and quadratic"
    - "Efficient run count (2k+1 for even k)"
  disadvantages:
    - "Requires three levels per factor"
    - "Cannot estimate the full quadratic model when more than about three factors are active"
    - "Relatively new - less practitioner experience"
  common_misconceptions:
    - "DSDs replace RSM designs - they supplement screening, but follow-up RSM is needed when many factors are active"
  references:
    - "Jones & Nachtsheim (2011)"
    - "Jones & Nachtsheim (2013) - categorical factors"

- id: omars
  display_name: "Orthogonal Minimally Aliased Response Surface (OMARS)"
  category: response_surface
  description:
    novice: >
      A three-level design that keeps every main effect cleanly separated from
      curvature and interaction effects, while using fewer runs than a full
      response-surface design.
    intermediate: >
      OMARS designs (Núñez Ares & Goos, 2020) are three-level designs in which
      all main effects are mutually orthogonal and orthogonal to every
      second-order term (pure quadratics and two-factor interactions). Aliasing
      is confined to the second-order block, so screening and response-surface
      goals can be pursued in a single design with a flexible run count.
    expert: >
      OMARS designs generalize definitive screening designs: the DSD
      (conference-matrix foldover) is the minimal member of the OMARS family.
      The full family is obtained by enumeration, trading off run size against
      second-order aliasing, projection, and estimation efficiency. This
      package constructs the conference-foldover family directly and provides
      omars_properties() / is_omars() to verify the defining orthogonality
      properties of any candidate design.
  suitable_for:
    - "Three or more continuous factors, to screen and to detect curvature in one design"
    - "When main effects must be clear of all two-factor interactions and quadratics"
    - "When a number of runs between a screening design and a response surface design is wanted"
  properties:
    resolution: "Main effects clear of all second-order terms"
    orthogonal: "Main effects mutually orthogonal and orthogonal to 2FI and quadratic"
    rotatable: false
    supports_quadratic: "Partial (depends on run size and active factors)"
    supports_interaction: "Partial (second-order terms are mutually aliased)"
  min_runs:
    formula: "2k + 1 (even k) or 2k + 3 (odd k) for the minimal conference-foldover member"
    examples: {"3": 9, "4": 9, "5": 13, "6": 13}
  supports_models:
    - main_effects
    - "quadratic (limited active factors)"
  can_augment_to:
    - {target: ccd, method: "Follow up the active factors with a response surface design"}
  advantages:
    - "Main effects orthogonal to each other and to all second-order terms"
    - "Three-level, so curvature is detectable"
    - "Flexible run count across the enumerated family"
  disadvantages:
    - "Requires three levels per factor"
    - "Second-order terms are mutually aliased"
    - "Larger members require enumeration rather than a closed-form construction"
  common_misconceptions:
    - "OMARS designs are unrelated to DSDs - in fact the DSD is the minimal OMARS design"
  references:
    - "Núñez Ares & Goos (2020), Technometrics 62(1):21-36"
    - "Jones & Nachtsheim (2011)"

- id: taguchi
  display_name: "Taguchi Orthogonal Array"
  category: screening
  description:
    novice: >
      A table of runs, such as L8, L9 or L18, in which every pair of factors
      meets at each combination of their levels equally often. Taguchi made
      these arrays widely used for improving the quality of a product.
    intermediate: >
      An orthogonal array of strength 2, written L_N, has N runs and a column
      for each factor. In any two columns every pair of levels appears equally
      often, so the main effects are estimated independently of each other.
      Columns can have different numbers of levels: L18 holds one two-level
      and seven three-level factors. Two-factor interactions are aliased with
      main effects unless columns are left free for them. In robust parameter
      design the control factors are in an inner array and the noise factors
      in an outer array, and the two are crossed.
    expert: >
      Orthogonal arrays were introduced by Rao (1947); Taguchi tabulated a
      standard set for quality engineering. L4, L8, L16 and L32 are regular
      2^(k-p) fractions, L12 is equivalent to the 12-run Plackett-Burman
      design, and L9, L27 and L81 are regular 3^(k-p) fractions. In a regular
      array the interaction of two columns falls in specific other columns, so
      it is kept clear by leaving those empty. In L12, L18, L36 and L54 an
      interaction is spread over the other columns. The analysis of crossed
      arrays by signal-to-noise ratios has been criticized (Box 1988; Nair
      1992): a combined array often needs fewer runs.
  suitable_for:
    - "Many factors, some with three or more levels"
    - "Each factor's own effect is wanted from few runs"
    - "A product must stay on target while conditions it cannot control vary (an inner and an outer array)"
  properties:
    resolution: "III in general: main effects are clear of each other, not of two-factor interactions"
    orthogonal: true
    rotatable: false
    supports_quadratic: "For a factor at three or more levels, the curvature of its own effect"
    supports_interaction: "Only an interaction that columns were left free for, in a regular array"
  min_runs:
    formula: "The smallest standard array with a column for every factor"
    examples: {"3_two_level": 4, "7_two_level": 8, "11_two_level": 12, "15_two_level": 16, "4_three_level": 9, "13_three_level": 27}
  supports_models:
    - main_effects
  can_augment_to:
    - {target: fractional_factorial, method: "Study the active two-level factors in a fraction that keeps their interactions clear"}
    - {target: ccd, method: "Follow up the active factors with a response surface design"}
  advantages:
    - "Main effects of many factors from few runs"
    - "Factors with different numbers of levels fit in one array"
    - "Tabulated arrays: the runs can be laid out by hand"
  disadvantages:
    - "Interactions between factors are mixed with the main effects unless columns are kept free for them"
    - "A full array leaves no runs to estimate the error from"
    - "Crossing an inner and an outer array multiplies their runs"
  common_misconceptions:
    - "Taguchi arrays are a kind of design of their own - several are the same runs as a two-level fractional factorial or a Plackett-Burman design"
    - "An orthogonal array shows that interactions are absent - a saturated array cannot detect them"
  references:
    - "Rao (1947)"
    - "Taguchi (1987), System of Experimental Design"
    - "Phadke (1989), Quality Engineering Using Robust Design"
    - "Wu & Hamada (2009), Ch. 8 and 11"

- id: mixture
  display_name: "Mixture Design"
  category: mixture
  description:
    novice: >
      An experiment on a blend, where the factors are the proportions of the
      ingredients and add up to a fixed total. Raising one ingredient lowers
      the others, so the runs are placed on a simplex: a triangle, for three
      ingredients.
    intermediate: >
      The q components of a mixture are proportions that sum to 1, so the
      region is a simplex of q - 1 dimensions. A polynomial with an intercept
      cannot be estimated under that constraint, and a Scheffé model is fitted
      instead: a term for each component, and in the quadratic model a
      blending term for each pair. A simplex-lattice design {q, m} takes every
      blend whose proportions are multiples of 1/m; a simplex-centroid design
      takes the pure components and the equal blends of two, three and more of
      them. Limits on the components leave a polytope inside the simplex, and
      the runs come from its vertices, edge midpoints and centroid.
    expert: >
      Scheffé (1958) introduced the simplex-lattice designs and the canonical
      polynomials, and Scheffé (1963) the simplex-centroid design of 2^q - 1
      blends. The coefficient of x_i x_j measures nonlinear blending of two
      components (synergism or antagonism), not an interaction of independent
      factors. With lower bounds alone the region is a smaller simplex, which
      L-pseudocomponents rescale to the full one. With upper bounds, or
      constraints on several components, the extreme-vertices designs of
      McLean and Anderson (1966) apply, and a D- or I-optimal selection among
      candidate blends fits the design to a budget.
  suitable_for:
    - "The response depends on the proportions of the ingredients, not on the amount of the blend"
    - "A product is being formulated: a food, a fuel, a polymer, a coating"
    - "Some ingredients have a lower or an upper limit"
  properties:
    resolution: "Not applicable: the design is sized to a Scheffé model"
    orthogonal: false
    rotatable: false
    supports_quadratic: "The Scheffé quadratic model: a blending term for each pair of components"
    supports_interaction: "Blending terms of two or three components, not interactions of independent factors"
  min_runs:
    formula: "q(q+1)/2 + 1 for the Scheffé quadratic model: the pure components, the 50:50 blends and the centroid"
    examples: {"3": 7, "4": 11, "5": 16}
  supports_models:
    - scheffe_linear
    - scheffe_quadratic
    - scheffe_special_cubic
    - scheffe_cubic
  can_augment_to: []
  advantages:
    - "Keeps to the constraint that the proportions add up to a fixed total"
    - "Sized to the Scheffé model that will be fitted"
    - "Takes limits on single components and on sums of components"
  disadvantages:
    - "A model with an intercept cannot be fitted: a Scheffé model is used, and its terms are read as blending"
    - "The effect of one ingredient is not separate from the others: raising it lowers them"
    - "Limits on the ingredients cut the simplex down, and the design is built for what is left of it"
  common_misconceptions:
    - "The components can be set independently, like the factors of a factorial - the proportions sum to 1, so a change in one changes at least one other"
    - "The x_i x_j terms of a Scheffé model are interactions - they measure nonlinear blending of two components"
  references:
    - "Scheffé (1958)"
    - "Scheffé (1963)"
    - "McLean & Anderson (1966)"
    - "Cornell (2002), Experiments with Mixtures, 3rd ed."

- id: supersaturated
  display_name: "Supersaturated Design"
  category: screening
  description:
    novice: >
      A screening design with no more runs than factors. It cannot estimate
      each factor's effect apart from the others, and relies on only a few of
      the factors having a large effect.
    intermediate: >
      A supersaturated design studies k factors in n < k + 1 runs, so the
      main-effects model has more terms than there are runs and least squares
      cannot fit it. The columns cannot all be orthogonal; the design keeps
      them as close to orthogonal as possible, measured by E(s^2), the average
      of the squared inner products of pairs of columns. The analysis selects
      a few active factors, by forward selection, the lasso or the Dantzig
      selector, and is reliable only when few factors are active.
    expert: >
      Satterthwaite (1959) proposed random balance designs, and Booth and Cox
      (1962) the first systematic supersaturated designs, with the E(s^2)
      criterion. Lin (1993) takes the rows of a Hadamard matrix of order N in
      which one column is +1: N/2 runs for up to N - 2 balanced, nearly
      orthogonal columns, such as 6 runs for 10 factors from the 12-run
      Plackett-Burman design. Later constructions search by exchange (Nguyen
      1996; Li and Wu 1997), and Bayesian D-optimal designs (Jones, Lin and
      Nachtsheim 2008) allow any number of runs. This package uses Lin's
      construction, and keeps the branching column that gives the fewest fully
      aliased pairs of columns, then the smallest E(s^2).
  suitable_for:
    - "A very large number of factors is to be screened and each run is costly"
    - "Only a few of the factors are expected to matter"
  properties:
    resolution: "Below III: main effects are partially aliased with each other"
    orthogonal: false
    rotatable: false
    supports_quadratic: false
    supports_interaction: false
  min_runs:
    formula: "N/2 runs for up to N - 2 factors, N the order of a Hadamard matrix"
    examples: {"10": 6, "18": 10, "22": 12, "30": 16}
  supports_models:
    - "main_effects (a few active factors, found by variable selection)"
  can_augment_to:
    - {target: fractional_factorial, method: "Confirm the factors selected in a fraction with orthogonal columns"}
    - {target: dsd, method: "Study the factors selected in a design that also detects curvature"}
  advantages:
    - "Screens more factors than it has runs"
    - "Each factor is at each of its two levels in half of the runs"
  disadvantages:
    - "The effects are correlated with one another, so an active factor can be missed or a wrong one chosen"
    - "Least squares cannot fit all the factors at once: the analysis selects among them"
    - "Fails when many factors are active, or when the effects are small beside the noise"
  common_misconceptions:
    - "A supersaturated design estimates every main effect - it has fewer degrees of freedom than factors, and can only point to a few dominant ones"
  references:
    - "Booth & Cox (1962)"
    - "Lin (1993)"
    - "Jones, Lin & Nachtsheim (2008)"
    - "Wu & Hamada (2009), Ch. 9"

- id: d_optimal
  display_name: "D-Optimal Design"
  category: optimal
  description:
    novice: >
      A design that a computer search builds for your model, your number of
      runs and your region, where no standard design fits. It places the runs
      so that the coefficients of the model are estimated as precisely as
      possible.
    intermediate: >
      A D-optimal design maximizes the determinant of X'X for a stated model,
      which minimizes the volume of the joint confidence region of the
      coefficients. The experimenter gives the model, the number of runs and
      the region: factor ranges, constraints, categorical levels and any runs
      already made. An exchange algorithm searches for the best set of runs.
      The design is optimal for that model only, and has no replicates or
      runs to test lack of fit unless they are asked for.
    expert: >
      Kiefer (1959) and Kiefer and Wolfowitz (1960) set up the theory; their
      equivalence theorem ties D-optimality of a continuous design to
      G-optimality. Exact designs are found by point exchange over a candidate
      set (Fedorov 1972) or by coordinate exchange (Meyer and Nachtsheim
      1995), from several random starts because the search finds local
      optima. For a second-order model a D-optimal design places most runs on
      the boundary of the region. With hard-to-change factors the design is a
      split-plot design, optimal at an assumed ratio of whole-plot to subplot
      variance (Goos and Vandebroek 2003; Jones and Goos 2007). Bayesian
      D-optimality (DuMouchel and Jones 1994) guards against terms left out
      of the model.
  suitable_for:
    - "Constraints rule out some combinations of settings, so the region is not a cube or a sphere"
    - "The number of runs is fixed and no standard design has that size"
    - "Numeric and categorical factors are studied together"
    - "Runs already made are kept, and more are added to them"
    - "Some factors are hard to change (a split-plot design)"
  properties:
    resolution: "Set by the model that is named"
    orthogonal: "Not in general"
    rotatable: false
    supports_quadratic: "When the model named has quadratic terms"
    supports_interaction: "When the model named has interaction terms"
  min_runs:
    formula: "The number of coefficients of the model: (k+1)(k+2)/2 for the full quadratic model"
    examples: {"2": 6, "3": 10, "4": 15, "5": 21}
  supports_models:
    - main_effects
    - two_factor_interactions
    - quadratic
  can_augment_to:
    - {target: d_optimal, method: "Add runs chosen with the runs already made held fixed"}
  advantages:
    - "Any model, number of runs and region"
    - "The most precise joint estimate of the coefficients of the model named"
    - "Takes fixed runs, blocks, constraints and hard-to-change factors"
  disadvantages:
    - "Optimal only for the model named: a term left out of it may not be estimable"
    - "No replicates and no runs to test lack of fit, unless they are asked for"
    - "The search finds a local optimum: another random start can give a different design"
    - "Not orthogonal in general: the estimates are correlated"
  common_misconceptions:
    - "An optimal design is the best design - it is the best by one criterion, for one model and one number of runs, and a standard design is often D-optimal for its own model"
  references:
    - "Kiefer (1959)"
    - "Meyer & Nachtsheim (1995)"
    - "Atkinson, Donev & Tobias (2007), Optimum Experimental Designs, with SAS"
    - "Goos & Jones (2011), Optimal Design of Experiments: A Case Study Approach"

- id: i_optimal
  display_name: "I-Optimal Design"
  category: optimal
  description:
    novice: >
      A design that a computer search builds to predict well. It places the
      runs so that the predicted response is as precise as possible on
      average over the whole region.
    intermediate: >
      An I-optimal design minimizes the average variance of prediction over
      the experimental region for a stated model. Like a D-optimal design it
      is found by an exchange algorithm, for the model, the number of runs and
      the region that are given. For a second-order model it puts more runs
      in the interior and at the center than a D-optimal design does, and so
      predicts better there. It suits response surface work in a constrained
      region, or with a number of runs that no central composite or
      Box-Behnken design has.
    expert: >
      The criterion is the integral over the region of the prediction
      variance f(x)'(X'X)^-1 f(x), which equals trace[(X'X)^-1 M] with M the
      moment matrix of the region; it is also called IV- or V-optimality. M
      has a closed form for a cube and is found by sampling the region when
      it is constrained. G-optimality minimizes the maximum prediction
      variance instead, and A-optimality the average variance of the
      coefficients. For a split-plot structure the criterion uses the
      covariance of the generalized least squares estimator (Jones and Goos
      2012).
  suitable_for:
    - "The aim is to predict or to optimize the response, not to test which factors matter"
    - "A response surface model in a region that constraints cut down"
    - "A number of runs that no central composite or Box-Behnken design has"
  properties:
    resolution: "Set by the model that is named"
    orthogonal: "Not in general"
    rotatable: false
    supports_quadratic: "When the model named has quadratic terms"
    supports_interaction: "When the model named has interaction terms"
  min_runs:
    formula: "The number of coefficients of the model: (k+1)(k+2)/2 for the full quadratic model"
    examples: {"2": 6, "3": 10, "4": 15, "5": 21}
  supports_models:
    - main_effects
    - two_factor_interactions
    - quadratic
  can_augment_to:
    - {target: i_optimal, method: "Add runs chosen with the runs already made held fixed"}
  advantages:
    - "The lowest average variance of prediction for the model named"
    - "Any model, number of runs and region"
  disadvantages:
    - "Optimal only for the model named: a term left out of it may not be estimable"
    - "The coefficients are estimated less precisely than by a D-optimal design"
    - "The search finds a local optimum: another random start can give a different design"
  common_misconceptions:
    - "D-optimal and I-optimal designs are the same - for a model of main effects and interactions on a cube they often are, and for a quadratic model they differ"
  references:
    - "Atkinson, Donev & Tobias (2007), Optimum Experimental Designs, with SAS"
    - "Goos & Jones (2011), Optimal Design of Experiments: A Case Study Approach"
    - "Jones & Goos (2012)"
