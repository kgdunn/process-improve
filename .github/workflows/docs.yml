name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']
  workflow_dispatch:  # allow manual trigger

# Only the read scope at workflow level. The Pages-deploy scopes are
# granted to the `deploy` job alone: the `build` job executes arbitrary
# dependency and notebook code on every same-repo PR and must not carry
# deploy credentials while doing so.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel a superseded run on pull requests only. A PR's docs build is a check
  # on its head commit, so an older commit's build is dead weight the moment the
  # next push arrives. Pushes to main are never cancelled: they share one group
  # (no pull_request.number) and each one deploys, so cancelling would drop a
  # published docs update rather than merely discard a stale check.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read  # configure-pages (main-branch pushes only) queries the Pages config
    steps:
      - uses: actions/checkout@v7
      - name: Set up the project environment
        uses: ./.github/actions/setup-env
        with:
          python-version: "3.11"
      - name: Install pandoc (required by nbsphinx)
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6
      - name: Build docs
        run: uv run sphinx-build docs docs/_build/html -b html -W
      - name: Add the no-install browser app at /app
        run: uv run python scripts/build_web_app.py -o docs/_build/html/app
      # The deploy needs this job, so a built app that does not work is never published:
      # the smoke tests start Python in the built page under Pyodide, in Chromium, and run
      # the worked example there. Downloads are not cached, as a reader's are not.
      - name: Install Chromium for Playwright
        run: uv run --with playwright==1.64.1 playwright install --with-deps chromium
      - name: Check the app works before it is published
        run: >-
          uv run --with playwright==1.64.1 pytest tests/web/live -m smoke --live
          --web-app=docs/_build/html/app --cdn-cache=off --no-cov
      # A pull request's build, kept for its reviewer to try: download the artifact, unzip it,
      # `python -m http.server -d <the folder>`, and open http://localhost:8000/ or /mva/.
      - name: Keep the app built from this pull request
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: web-app-pr-${{ github.event.pull_request.number }}
          path: docs/_build/html/app
          if-no-files-found: error
          retention-days: 7
      # factori.al gets this same build, the one the smoke tests above just passed.
      - name: Keep the app for factori.al
        if: github.ref == 'refs/heads/main' && vars.FACTORIAL_KNOWN_HOSTS != ''
        uses: actions/upload-artifact@v7
        with:
          name: factorial-app
          path: docs/_build/html/app
          if-no-files-found: error
          retention-days: 7
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # The app a reader gets is the published one, so it is checked again once deployed. For a
  # few minutes Pages can serve the app before it from a cache: the check first waits until
  # the published manifest names this commit. Nothing is cached, as on a reader's first visit.
  check-published-app:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      APP: ${{ needs.deploy.outputs.page_url }}app/
    steps:
      - uses: actions/checkout@v7
      - name: Set up the project environment
        uses: ./.github/actions/setup-env
        with:
          python-version: "3.13"
      - name: Wait until the published app is this commit's
        run: uv run python tools/wait_for_web_app.py "$APP" "$GITHUB_SHA"
      - name: Install Chromium for Playwright
        run: uv run --with playwright==1.64.1 playwright install --with-deps chromium
      - name: Check the published app works
        run: >-
          uv run --with playwright==1.64.1 pytest tests/web/live -m smoke --live
          --web-app="$APP" --cdn-cache=off --no-cov

  # factori.al, the app's own address, is served from a server of its own (deploy/factorial).
  # It gets the build the smoke tests passed in the build job, over SSH, from a key that can do
  # nothing there but upload a build, switch to it and switch back. The switch is atomic, and
  # "Factorial: roll back" (factorial-rollback.yml) undoes it. Pushes to main deploy, and so
  # does a manual run on main; until the server's host key is known, both jobs are skipped.
  deploy-factorial:
    if: github.ref == 'refs/heads/main' && vars.FACTORIAL_KNOWN_HOSTS != ''
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    environment:
      name: factorial
      url: https://factori.al/
    # Shared with factorial-rollback.yml, so a rollback never runs during a deploy.
    concurrency:
      group: factorial
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions/factorial-ssh
      - uses: actions/download-artifact@v8
        with:
          name: factorial-app
          path: app
      - uses: ./.github/actions/factorial-ssh
        with:
          key: ${{ secrets.FACTORIAL_SSH_KEY }}
          known-hosts: ${{ vars.FACTORIAL_KNOWN_HOSTS }}
      - name: Upload this commit's build and switch factori.al to it
        shell: bash
        run: |
          # shellcheck disable=SC2029 # the commit is named here, on the runner, for the server to check
          tar -C app -czf - . | ssh factorial "upload $GITHUB_SHA"
          # shellcheck disable=SC2029
          ssh factorial "activate $GITHUB_SHA"
          { echo '```'; ssh factorial status; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # As check-published-app does for Pages. No cache stands between the server and a reader, so
  # the wait only confirms the switch took; the smoke tests then run against factori.al itself.
  check-factorial:
    needs: deploy-factorial
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      APP: https://factori.al/
    steps:
      - uses: actions/checkout@v7
      - name: Set up the project environment
        uses: ./.github/actions/setup-env
        with:
          python-version: "3.13"
      - name: Wait until factori.al serves this commit's build
        run: uv run python tools/wait_for_web_app.py "$APP" "$GITHUB_SHA" --timeout 120
      - name: Install Chromium for Playwright
        run: uv run --with playwright==1.64.1 playwright install --with-deps chromium
      - name: Check the app works on factori.al
        run: >-
          uv run --with playwright==1.64.1 pytest tests/web/live -m smoke --live
          --web-app="$APP" --cdn-cache=off --no-cov
