name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']
  workflow_dispatch:  # allow manual trigger

# Only the read scope at workflow level. The Pages-deploy scopes are
# granted to the `deploy` job alone: the `build` job executes arbitrary
# dependency and notebook code on every same-repo PR and must not carry
# deploy credentials while doing so.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel a superseded run on pull requests only. A PR's docs build is a check
  # on its head commit, so an older commit's build is dead weight the moment the
  # next push arrives. Pushes to main are never cancelled: they share one group
  # (no pull_request.number) and each one deploys, so cancelling would drop a
  # published docs update rather than merely discard a stale check.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read  # configure-pages (main-branch pushes only) queries the Pages config
    steps:
      - uses: actions/checkout@v7
      - name: Set up the project environment
        uses: ./.github/actions/setup-env
        with:
          python-version: "3.11"
      - name: Install pandoc (required by nbsphinx)
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6
      - name: Build docs
        run: uv run sphinx-build docs docs/_build/html -b html -W
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
