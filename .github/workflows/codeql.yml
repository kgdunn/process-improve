name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly run so new advisories applied to unchanged code still surface.
    - cron: "0 6 * * 1"

# Supersede a PR's own in-flight analysis when a new commit lands on it. Without
# this, every push to a branch left its predecessor's CodeQL database build
# running, and a handful of quick successive pushes could occupy the whole
# concurrent-job allowance with analyses whose results nobody would read.
#
# The group keys on the PR number when there is one, so a `push` to main and the
# Monday `schedule` run share a single group and queue behind each other rather
# than racing two SARIF uploads into the same category. Only pull requests
# cancel: a main-branch or scheduled analysis always runs to completion, because
# its results are what the security tab reports.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # The browser app's JavaScript (web/ and its tests) as well as the package's Python.
        language: [python, javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.39.1
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          # Leaves out the third-party code web/vendor holds unchanged; the file says why.
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
