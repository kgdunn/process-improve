name: Mutation testing

# Coverage says a line ran; mutation testing says a test would notice if it were wrong.
# mutmut changes one operator, constant or argument at a time in the modules listed under
# [tool.mutmut] in pyproject.toml, reruns the tests that reach that code, and counts a
# change no test fails ("survived"). A survivor is an assertion to strengthen, or an
# equivalent change, marked in the code with `# pragma: no mutate - <why>`. Nightly, as
# the whole run takes minutes per module; on a pull request only when this file changes.
on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/mutation.yml

permissions:
  contents: read

jobs:
  mutmut:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up the project environment
        uses: ./.github/actions/setup-env
        with:
          python-version: "3.13"
      # `--with` adds mutmut for this run only: no dev dependency, uv.lock untouched.
      - name: Mutate the modules in [tool.mutmut] and rerun their tests
        run: uv run --with mutmut==3.8.0 mutmut run --max-children 4
      - name: Fail on any mutant the tests do not catch
        run: |
          uv run --with mutmut==3.8.0 mutmut export-cicd-stats
          stats=mutants/mutmut-cicd-stats.json
          jq -r '"\(.killed) of \(.total) mutants killed; \(.survived) survived, \(.no_tests) reached by no test, \(.timeout) timed out."' "$stats" | tee -a "$GITHUB_STEP_SUMMARY"
          missed=$(jq '.survived + .no_tests + .suspicious + .timeout' "$stats")
          if [ "$missed" != "0" ]; then
            { echo '```diff'; uv run --with mutmut==3.8.0 mutmut results | awk -F: '{print $1}' |
              while read -r name; do uv run --with mutmut==3.8.0 mutmut show "$name"; done; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # A failed scheduled run is easy to miss, so it opens an issue (one at a time).
      - name: Open an issue when the nightly run fails
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Mutation testing found a change no test catches"
          open=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq 'length')
          if [ "$open" = "0" ]; then
            gh issue create --title "$title" --body "The nightly mutation run failed; its summary shows each mutant: $RUN_URL"
          fi
