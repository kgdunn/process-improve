name: Mutation testing

# Coverage says a line ran; mutation testing says a test would notice if it were wrong.
# mutmut changes one operator, constant or argument at a time in the modules listed under
# [tool.mutmut] in pyproject.toml, reruns the tests that reach that code, and counts a
# change no test fails ("survived"). A survivor is an assertion to strengthen, or an
# equivalent change, marked in the code with `# pragma: no mutate - <why>`. Nightly, as
# the whole run takes minutes per module; on a pull request only when this file changes.
on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/mutation.yml

permissions:
  contents: read

jobs:
  # One job per group of modules, in parallel: the whole config in one job outgrew its
  # 60 minutes. Each names its modules' mutants by pattern (a mutant is called
  # `<module>.x_<function>__mutmut_<n>`), so a module in [tool.mutmut] needs a pattern
  # here too; tests/test_tooling_versions.py fails until every module has exactly one.
  mutmut:
    name: mutmut (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: monitoring
            patterns: process_improve.monitoring.*
          - name: limits and kernels
            patterns: >-
              process_improve.multivariate._limits.*
              process_improve.multivariate._nipals.*
              process_improve.multivariate._preprocessing.*
              process_improve.multivariate._projection.*
              process_improve.multivariate._impute.*
              process_improve.multivariate._robust.*
          - name: diagnostics
            patterns: process_improve.multivariate._diagnostics.*
          - name: resampling, null, procrustes, prm, opls
            patterns: >-
              process_improve.multivariate._resampling.*
              process_improve.multivariate._null.*
              process_improve.multivariate._procrustes.*
              process_improve.multivariate._prm.*
              process_improve.multivariate._opls.*
          - name: pca
            patterns: process_improve.multivariate._pca.*
          # PLS is split in two of about equal test time: its cross-validation and NIPALS,
          # then the rest (a method's mutants are named `_pls.xǁPLSǁ<method>__mutmut_<n>`).
          - name: pls cross-validation and nipals
            patterns: >-
              process_improve.multivariate._pls.xǁPLSǁselect_n_components*
              process_improve.multivariate._pls.xǁPLSǁnested_cv*
              process_improve.multivariate._pls.xǁPLSǁcross_validate*
              process_improve.multivariate._pls.xǁPLSǁ_fit_nipals*
          - name: pls
            patterns: >-
              process_improve.multivariate._pls.x_*
              process_improve.multivariate._pls.xǁPLSǁ[!_cns]*
              process_improve.multivariate._pls.xǁPLSǁ_[!f]*
              process_improve.multivariate._pls.xǁPLSǁ_fit_imputed*
              process_improve.multivariate._pls.xǁPLSǁcompare_cv_criteria*
              process_improve.multivariate._pls.xǁPLSǁscore*
    steps:
      - uses: actions/checkout@v7
      - name: Set up the project environment
        uses: ./.github/actions/setup-env
        with:
          python-version: "3.13"
      # `--with` adds mutmut for this run only: no dev dependency, uv.lock untouched. Every
      # job mutates the whole config and collects which tests reach which function, then
      # runs only the mutants its patterns name; the rest stay "not checked". `set -f` keeps
      # the shell from expanding the patterns' `*` as file names.
      - name: Mutate the modules in [tool.mutmut] and rerun their tests
        env:
          PATTERNS: ${{ matrix.shard.patterns }}
        run: |
          set -f
          # shellcheck disable=SC2086 # one argument per pattern
          uv run --with mutmut==3.8.1 mutmut run --max-children 4 $PATTERNS
      # A mutant whose tests overrun mutmut's CPU limit (about 30 times their usual time) made the
      # code loop or slow down, which the tests noticed: mutmut's own score counts it as killed, and
      # so does this gate. Whether one times out depends on the runner's speed, not on the tests.
      - name: Fail on any mutant the tests do not catch
        run: |
          uv run --with mutmut==3.8.1 mutmut export-cicd-stats
          stats=mutants/mutmut-cicd-stats.json
          # The totals count this job's mutants only: the others were not run here.
          jq -r '(.killed + .timeout + .survived + .no_tests + .suspicious + .skipped + .segfault) as $run |
            "\(.killed + .timeout) of \($run) mutants caught (\(.timeout) of them by timing out); \(.survived) survived, \(.no_tests) reached by no test."' \
            "$stats" | tee -a "$GITHUB_STEP_SUMMARY"
          missed=$(jq '.survived + .no_tests + .suspicious' "$stats")
          if [ "$missed" != "0" ]; then
            { echo '```diff'; uv run --with mutmut==3.8.1 mutmut results | grep -E ': (survived|no tests|suspicious)$' |
              awk -F: '{print $1}' | while read -r name; do uv run --with mutmut==3.8.1 mutmut show "$name"; done
              echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  # A failed scheduled run is easy to miss, so it opens an issue (one at a time) when any
  # group fails.
  open-issue:
    name: Open an issue when the nightly run fails
    needs: mutmut
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open an issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Mutation testing found a change no test catches"
          open=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq 'length')
          if [ "$open" = "0" ]; then
            gh issue create --title "$title" --body "The nightly mutation run failed; the summary of each failed job shows its mutants: $RUN_URL"
          fi
