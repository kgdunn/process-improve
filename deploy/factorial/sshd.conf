# The account factori.al's deploy key logs in as: sshd runs one command for it, whatever the
# key asks, and offers it nothing else (no shell, no terminal, no forwarding).
#
# Installed as /etc/ssh/sshd_config.d/factorial.conf by setup.sh, which checks the whole
# configuration with `sshd -t` before sshd reads it. A Match block in an included file ends
# with that file.

Match User factorial
	AuthorizedKeysFile /etc/ssh/authorized_keys/factorial
	ForceCommand /usr/local/bin/factorial-deploy /srv/factorial
	PasswordAuthentication no
	KbdInteractiveAuthentication no
	PermitTTY no
	PermitUserRC no
	AllowAgentForwarding no
	AllowTcpForwarding no
	AllowStreamLocalForwarding no
	PermitTunnel no
	X11Forwarding no
