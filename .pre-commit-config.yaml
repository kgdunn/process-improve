# pre-commit.ci (https://pre-commit.ci) runs these hooks on every pull request and
# pushes the fixes it can make (#39). It works once its GitHub App is installed on the
# repository; this section only tunes it.
ci:
    autofix_prs: true
    autofix_commit_msg: "style: apply pre-commit fixes"
    # Quarterly: a bump of ruff-pre-commit or mirrors-mypy must move the matching pin in
    # pyproject.toml too (tests/test_tooling_versions.py fails the PR until it does), so
    # each autoupdate PR needs a person to finish it.
    autoupdate_schedule: quarterly
    autoupdate_commit_msg: "chore(deps): update pre-commit hooks"
    # CI's typecheck job runs mypy over src/process_improve with every dependency
    # installed. This hook's isolated environment has none of them, so on pre-commit.ci
    # it would only repeat a weaker version of that check.
    skip: [mypy]

repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: trailing-whitespace
          - id: check-ast
          - id: check-yaml
          - id: check-toml
          - id: fix-byte-order-marker
          - id: check-case-conflict
          - id: check-docstring-first
            # `batch/datasets.py` documents its three URL constants with PEP 258
            # attribute docstrings, which Sphinx autodoc renders. The hook's heuristic
            # reads any second module-level string as a second module docstring, so it
            # reports a style the repo uses on purpose.
            exclude: ^src/process_improve/batch/datasets\.py$
          - id: debug-statements
          - id: detect-private-key
          - id: detect-aws-credentials
            args: [--allow-missing-credentials]
          - id: forbid-new-submodules
          - id: end-of-file-fixer
          - id: check-executables-have-shebangs
          - id: check-added-large-files
            args: ["--maxkb=5000"]
          - id: check-merge-conflict
          - id: mixed-line-ending
          - id: name-tests-test
            args: ["--django"]
            # Helpers and fixture builders that live beside the tests but are not tests:
            # pytest must not collect them, which is why they are named this way.
            exclude: ^tests/(_[^/]+\.py|fixtures/.*/prepare_fixture\.py)$

    - repo: https://github.com/pre-commit/mirrors-mypy
      rev: v1.19.1
      hooks:
          - id: mypy
            args: ["--ignore-missing-imports", "--check-untyped-defs"]

    - repo: https://github.com/asottile/blacken-docs
      rev: 1.20.0
      hooks:
          - id: blacken-docs

    - repo: https://github.com/kynan/nbstripout
      rev: 0.9.1
      hooks:
          - id: nbstripout

    # Keep this in step with the `ruff` pin in pyproject.toml: pre-commit and the
    # CI `ruff format --check .` gate must run the same formatter, or locally
    # formatted code can still fail in CI.
    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.15.22
      hooks:
          - id: ruff-check
          - id: ruff-format
