<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Experimental design concept graph: Factorial</title>
  <meta name="description" content="The ideas of designed experiments in the book Process Improvement using Data, and how they link: zoom from topics to the terms in them, and tap a term to read it with the line of the book it comes from.">
  <link rel="canonical" href="https://factori.al/map/">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#faf8f3" media="(prefers-color-scheme: light)" data-scheme="light">
  <meta name="theme-color" content="#141517" media="(prefers-color-scheme: dark)" data-scheme="dark">
  <script>
    /* The colour mode chosen with the switch (here or in the app), put on the page before it is drawn. */
    try {
      const mode = localStorage.getItem("factorial-mode");
      const chosen = mode === "light" || mode === "dark";
      if (chosen) document.documentElement.dataset.theme = mode;
      document.documentElement.dataset.mode = chosen ? mode : "auto";
    } catch {
      /* storage refused: the system's mode */
    }
  </script>
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="process-improve">
  <meta property="og:title" content="Experimental design concept graph: Factorial">
  <meta property="og:description" content="The ideas of designed experiments and how they link, each one quoting the book it comes from.">
  <meta property="og:url" content="https://factori.al/map/">
  <meta property="og:image" content="https://factori.al/map/og-card.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="The experimental design concept graph: ten topics of designed experiments, drawn as circles sized by their terms and joined where their terms link.">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
<main class="map">
  <div class="map-top">
    <p class="about__back"><a href="../"><img src="../favicon.svg" alt="" width="28" height="28"> Back to Factorial</a></p>
    <!-- Feedback (feedback.js): the app's own dialog, to the same relay; nothing leaves until the reader presses Send. -->
    <button type="button" id="feedback" class="feedback-button" data-feedback="general">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 4.5h16v11H10l-4.5 4v-4H4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M8 8.5h8M8 11.5h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Feedback</span></button>
    <!-- Light, dark, or the system's, in turn, as the start page's switch does: its icon shows the mode now. -->
    <button type="button" id="mode" class="mode-switch" title="light/dark" aria-label="Colour mode: the system's">
      <svg data-for="auto" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3.5a8.5 8.5 0 0 0 0 17z" fill="currentColor"/></svg>
      <svg data-for="light" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></g></svg>
      <svg data-for="dark" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a6.8 6.8 0 0 0 10.7 10.7z" fill="currentColor"/></svg>
    </button>
  </div>
  <h1>Experimental design concept graph</h1>
  <p class="lede">How the ideas of designed experiments link, in <em>Process Improvement using Data</em>.</p>

  <!-- Above the map, three rows: the search with the switches and the level, the kinds of term, the other textbooks. -->
  <div class="map-find">
    <div class="map-search">
      <label for="q">Find a term</label>
      <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="aliasing, CCD, foldover..."
        aria-controls="results">
      <div class="map-results" id="results" role="listbox" hidden></div>
    </div>
    <div class="map-view" role="group" aria-label="What the map shows">
      <label class="switch map-names"><input type="checkbox" id="labels" checked>
        <span class="switch__track" aria-hidden="true"></span><span class="switch__text"><span class="map-full">Term names</span><span class="map-short" aria-hidden="true">Names</span></span></label>
      <label class="switch map-verbs"><input type="checkbox" id="verbs">
        <span class="switch__track" aria-hidden="true"></span><span class="switch__text"><span class="map-full">Link labels</span><span class="map-short" aria-hidden="true">Links</span></span></label>
      <label class="map-level"><span class="map-full">Level</span>
        <input type="range" id="level" min="1" max="3" step="1" value="1" aria-valuetext="Beginner">
        <output id="level-name" for="level">Beginner</output></label>
    </div>
  </div>
  <div class="map-legend" id="legend" role="group" aria-label="Kinds of term shown on the map"></div>
  <div class="map-books" id="books" role="group" aria-label="What other textbooks also state" hidden>
    <label class="switch"><input type="checkbox" id="others">
      <span class="switch__track" aria-hidden="true"></span><span class="switch__text"><span class="map-full">Other textbooks</span></span></label>
    <span class="map-bookkey" id="bookkey"></span>
  </div>

  <div class="map-box">
    <div id="cy" role="img" aria-label="Map of the topics and terms. The same items are listed as buttons below the map."></div>
  </div>
  <div class="map-bar">
    <div class="map-strip" id="strip"><span id="striptext"></span>
      <button type="button" class="button" id="details">Details</button></div>
    <div class="map-controls">
      <button type="button" class="button" id="zin" aria-label="Zoom in">+</button>
      <button type="button" class="button" id="zout" aria-label="Zoom out">&minus;</button>
      <button type="button" class="button" id="home" aria-label="Show all topics">
        <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4"/></svg>
      </button>
    </div>
  </div>

  <section class="map-card" id="card" aria-live="polite"></section>
  <div class="map-links" id="links" aria-label="Links from the selected item"></div>

  <section class="map-how" id="how" aria-labelledby="how-title"></section>
</main>
<script src="../map.js" type="module"></script>
</body>
</html>
